<!doctype html>
<!-- OG-картинка для ссылок (1200×630). Пересобрать: bash brand/render.sh -->
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=block" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#f4f1ea;font-family:Manrope,sans-serif;color:#111}
  .wrap{position:relative;width:1200px;height:630px;padding:64px 0 0 64px}
  .logo{width:560px;display:block}
  h1{font-size:46px;font-weight:800;line-height:1.08;letter-spacing:-1px;margin:40px 0 0;width:520px}
  .meta{display:flex;gap:14px;margin-top:36px}
  .tag{border:3px solid #111;border-radius:999px;padding:10px 22px;font-size:24px;font-weight:800;background:#fff}
  .tag.pink{background:#ff3d8b;color:#fff}
  .ph{position:absolute;width:264px;height:330px;object-fit:cover;border:4px solid #111;border-radius:18px;box-shadow:8px 8px 0 #111;background:#fff}
  .a{right:290px;top:48px;transform:rotate(-6deg)}
  .b{right:48px;top:36px;transform:rotate(5deg)}
  .c{right:170px;top:262px;transform:rotate(-2deg)}
</style></head><body><div class="wrap">
  <img class="logo" src="logo/logo-sticker.svg" alt="">
  <h1>Носки, за которые не стыдно разуться</h1>
  <div class="meta"><span class="tag pink">от 200 ₽</span><span class="tag">Новосибирск</span></div>
  <img class="ph a" src="../shop/public/products/socks-teddy-1986/1791995509438.jpg" alt="">
  <img class="ph b" src="../shop/public/products/socks-bows/1792040197912.jpg" alt="">
  <img class="ph c" src="../shop/public/products/socks-fluffy-smile/1792040198058.jpg" alt="">
</div></body></html>
